<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>売買tweet生成 - MoE アイテム台帳</title><link rel="stylesheet" href="style.css"><body class="expanded trade-page">
<header><h1>売買tweet生成</h1><p>販売個数と価格を入力して、tweetのテンプレートを作成します。</p></header>
<main><p id="trade-status" role="status">選択したアイテムを読み込み中…</p>
<div class="result-table"><table id="trade-table"><thead><tr><th>アイテム名</th><th class="sale-quantity">販売個数</th><th>価格（自由入力）</th><th class="remove-col">削除</th></tr></thead><tbody id="trade-items"></tbody></table></div>
<label class="trade-comment">補足（サーバー名・連絡方法など）<textarea id="trade-comment" rows="3" placeholder="例：P鯖／希望者はリプライください"></textarea></label>
<div class="toolbar"><button id="trade-generate">tweetテンプレートを作成</button><span id="trade-count"></span></div>
<p class="muted">通常tweetの280換算を目安に判定します（日本語は2換算）。絵文字やURLを含む場合は多めに数えるため、早めに画像へ切り替わることがあります。価格が空欄の品は「価格未入力」と表示します。</p>
<section id="trade-output" hidden><h2 id="trade-mode"></h2><p id="trade-explanation"></p><textarea id="trade-text" rows="8" readonly aria-label="tweetテンプレート"></textarea><div class="toolbar"><button id="trade-copy">tweetテキストをコピー</button><button id="trade-download" hidden>画像をダウンロード（PNG）</button></div><div id="trade-image" hidden><img id="trade-preview" alt="売買アイテム一覧の画像プレビュー"></div></section>
</main><footer>MoE アイテム台帳 v0.1.5</footer><script src="trade-core.js"></script><script src="trade.js"></script></body></html>
