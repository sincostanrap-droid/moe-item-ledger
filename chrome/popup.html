<!doctype html><html lang="ja"><meta charset="utf-8"><title>MoE アイテム台帳</title><link rel="stylesheet" href="style.css"><body>
<header><h1>MoE アイテム台帳 <small>v0.1.3</small></h1><p>アカウントをまたいで、持ち物を検索</p></header>
<nav><button data-tab="search" class="active">アイテム検索</button><button data-tab="accounts">アカウント</button><button data-tab="settings">設定・バックアップ</button></nav>
<main><p id="status" role="status">保存した在庫を読み込み中…</p>
<section id="search"><div class="toolbar"><input id="query" type="search" placeholder="アイテム名を検索" aria-label="アイテム名を検索"><button id="capture">このページを取得</button></div><div class="toolbar"><select id="filter" aria-label="アカウント"><option value="">全アカウント</option></select><span id="count"></span></div><div class="toolbar"><button id="csv-results">検索結果をCSV保存</button><button id="csv-all">全件をCSV保存</button></div><p class="muted">同名アイテムをアカウント横断でまとめ、個数を合算します。アカウントを絞ると、そのアカウント分のみ表示します。更新日時は台帳の取得日時で、複数ページ分は最も古い日時を表示します。</p><div class="result-table"><table><thead><tr><th><button data-sort="name" data-label="アイテム名">アイテム名 ▲</button></th><th><button data-sort="account" data-label="アカウント">アカウント ↕</button><button data-sort="loginId" data-label="ログインID">ログインID ↕</button></th><th class="quantity"><button data-sort="quantity" data-label="合計個数">合計個数 ↕</button></th><th class="updated"><button data-sort="updatedAt" data-label="更新日時">更新日時 ↕</button></th></tr></thead><tbody id="results"></tbody></table></div></section>
<section id="accounts" hidden><h2>登録アカウント</h2><p class="muted">IDは任意です。表示名が変わった場合は別アカウントとして記録されます。</p><div id="account-list"></div></section>
<section id="settings" hidden><label><input type="checkbox" id="auto"> 開いたアイテムボックスを自動取得</label><p>レンタル枠は各ページを開くと取得します。ゲーム内の転送操作は行いません。</p><button id="export">バックアップを保存</button><label class="import">バックアップを復元<input type="file" id="import" accept=".json"></label><p class="muted">復元は台帳全体を置き換えます。Firefox一時拡張の削除・再読み込み前にはバックアップしてください。</p></section></main>
<footer>保存先：このブラウザ内 <button id="open">大きな画面で開く</button></footer><script src="search.js"></script><script src="csv.js"></script><script src="popup.js"></script></body></html>
